name: Build R Package Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-r-package:
    runs-on: ${{ matrix.config.os }}
    strategy:
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'release'}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: any::rcmdcheck

      # ✅ Windows only: Install Rtools (必要时)
      - name: Install Rtools (Windows only)
        if: runner.os == 'Windows'
        run: |
          choco install rtools --no-progress -y
          echo "RTOOLS40_HOME=C:\\rtools40" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PATH=${env:RTOOLS40_HOME}\\usr\\bin;${env:PATH}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ✅ Build & Check package
      - name: Build and check package
        env:
          _R_CHECK_CRAN_INCOMING_: false
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-build-vignettes"), error_on = "error")'

      # ✅ Build binary package (platform-dependent)
      - name: Build binary package
        run: |
          R CMD INSTALL --build .

      # ✅ Upload artifacts
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-binary
          path: |
            *.zip
            *.tgz
            *.tar.gz

  # ✅ Release stage: collect and publish all artifacts
  release:
    needs: build-r-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          artifacts: "artifacts/**/*"
          generateReleaseNotes: true
