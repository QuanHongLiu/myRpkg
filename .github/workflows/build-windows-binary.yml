name: Build Windows Binary R Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-binary:
    name: Build R binary package on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'  # 改成你希望的 R 版本

      - name: Install Rtools
        uses: r-lib/actions/setup-rtools@v2

      - name: Install package dependencies
        run: |
          Rscript -e 'install.packages("remotes", repos="https://cran.rstudio.com")'
          Rscript -e 'remotes::install_deps(dependencies = TRUE)'

      - name: Build binary package (.zip)
        run: |
          mkdir dist
          R CMD INSTALL --build .
          move *.zip dist\

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/
