name: Build and Publish Windows Binary R Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-binary:
    name: Build R binary package on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Install package dependencies
        run: |
          Rscript -e "install.packages('remotes', repos='https://cran.rstudio.com')"
          Rscript -e "remotes::install_deps(dependencies = TRUE)"

      - name: Build binary package (.zip)
        shell: cmd
        run: |
          mkdir dist
          R CMD INSTALL --build .
          move *.zip dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: dist/

      - name: Install GitHub CLI
        shell: pwsh
        run: choco install gh -y

      - name: Create release and upload package
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          gh auth login --with-token --hostname github.com --token $env:GITHUB_TOKEN

          $R_VERSION = "4.3.3"
          $TAG = "v$R_VERSION-win-$(Get-Date -Format 'yyyyMMdd')"

          gh release create $TAG dist/*.zip `
            --repo QuanHongLiu/myRpkg_binary `
            --title "Windows binary for myRpkg" `
            --notes "Built automatically via GitHub Actions"
