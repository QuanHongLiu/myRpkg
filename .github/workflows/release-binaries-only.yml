name: Build and Release Binary Packages Only

on:
  release:
    types: [created]
  workflow_dispatch:  # 允许手动触发

env:
  PACKAGE_NAME: myRpkg

jobs:
  build-binaries:
    name: Build Binary for ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary_ext: zip
            install_type: win.binary
          # macOS Intel
          - os: macos-13
            platform: darwin
            arch: x86_64
            binary_ext: tgz
            install_type: mac.binary
          # macOS Apple Silicon
          - os: macos-14
            platform: darwin
            arch: arm64
            binary_ext: tgz
            install_type: mac.binary
          # Linux Ubuntu
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            binary_ext: tar.gz
            install_type: source

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          zlib1g-dev \
          libicu-dev

    - name: Setup Rtools (Windows)
      if: matrix.os == 'windows-latest'
      uses: r-lib/actions/setup-rtools@v2

    - name: Install package dependencies
      run: |
        R -e "install.packages('remotes', repos='https://cloud.r-project.org')"
        R -e "remotes::install_deps(dependencies = TRUE)"

    - name: Extract package version
      id: pkg-info
      run: |
        PACKAGE_VERSION=$(R -q -e "cat(read.dcf('DESCRIPTION')[1,'Version'])" | tr -d ' "')
        PACKAGE_NAME=$(R -q -e "cat(read.dcf('DESCRIPTION')[1,'Package'])" | tr -d ' "')
        echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
        echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "Building $PACKAGE_NAME version $PACKAGE_VERSION"

    - name: Build binary package
      run: |
        # 直接构建二进制包，跳过源码包
        if [ "${{ matrix.platform }}" = "windows" ]; then
          R CMD INSTALL --build --no-docs --compile-both --no-multiarch .
          # 重命名文件以包含平台信息
          find . -name "*.zip" -exec mv {} ${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.zip \;
        elif [ "${{ matrix.platform }}" = "linux" ]; then
          # 对于Linux，我们构建二进制包但保持为tar.gz格式
          R CMD INSTALL --build --no-docs .
          find . -name "*.tgz" -exec mv {} ${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.tar.gz \;
        else
          # macOS
          R CMD INSTALL --build --no-docs .
          find . -name "*.tgz" -exec mv {} ${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.tgz \;
        fi

    - name: Upload binary to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.binary_ext }}
        asset_name: ${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.binary_ext }}
        asset_content_type: application/octet-stream

    - name: Verify binary package
      run: |
        echo "Generated binary files:"
        ls -la *.${{ matrix.binary_ext }}
        echo "Package info:"
        if [ "${{ matrix.platform }}" = "windows" ]; then
          unzip -l ${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.zip | head -10
        else
          tar -tzf ${{ steps.pkg-info.outputs.package_name }}_${{ steps.pkg-info.outputs.package_version }}_${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.binary_ext }} | head -10
        fi